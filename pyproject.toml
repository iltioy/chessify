[project]
name = "chessify"
version = "0.1.0"
description = "Сцена из сериала как шахматная партия: анализ диалога и рендер вертикального ролика"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "jinja2>=3.1",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "scenedetect>=0.6.4",
]

[project.optional-dependencies]
# Распознавание речи: CTranslate2 на CPU/GPU. На Windows для GPU нужны DLL cuBLAS/cuDNN.
asr = [
    "faster-whisper>=1.2",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9; sys_platform == 'win32'",
]
# Разметка спикеров и запасной Whisper на PyTorch (cu128 — поддержка RTX 50-й серии).
diar = [
    "torch>=2.7",
    "torchaudio>=2.7",
    "pyannote.audio>=4.0",
    "soundfile>=0.12",
]

# Веб-интерфейс.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
# Прямой Claude API (по желанию; без ключа Claude доступен через адаптер claude_code по подписке).
anthropic = ["anthropic>=0.40"]

[project.scripts]
chessify = "chessify.cli:app"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessify"]

[tool.pyright]
venvPath = "."
venv = ".venv"
