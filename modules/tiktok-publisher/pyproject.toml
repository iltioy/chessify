[project]
name = "tiktok-publisher"
version = "0.1.0"
description = "Publish videos to TikTok accounts via the official Content Posting API: multi-account token store, OAuth, chunked upload"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Шифрование файла с токенами (ключ — в TIKTOK_PUBLISHER_KEY).
crypto = ["cryptography>=42"]

[project.scripts]
tiktok-publisher = "tiktok_publisher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_publisher"]
